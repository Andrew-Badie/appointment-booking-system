name: Local stack integration
on:
  push:
    branches: [main, "build/local-compose"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start all services
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: Exercise login, search, booking, messaging and persistence
        run: python3 scripts/smoke.py
      - name: Container status and logs
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 100
          docker image inspect kubemq/kubemq-community:latest --format '{{json .RepoDigests}}'
      - name: Clean up disposable CI stack
        if: always()
        run: docker compose down --volumes
