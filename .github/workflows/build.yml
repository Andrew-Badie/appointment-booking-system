name: Build Java services
on:
  push:
    branches: [main, "build/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Java 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Show tool versions
        run: mvn --version
      - name: Compile and package all four services
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Check all WAR outputs
        shell: bash
        run: |
          test -s services/Frontend/target/FrontEnd-1.0-SNAPSHOT.war
          test -s services/SearchAppointments/target/SearchAppointments-1.0-SNAPSHOT.war
          test -s services/BookAppointment/target/BookAppointment-1.0-SNAPSHOT.war
          test -s services/ConfirmAppointment/target/ConfirmAppointment-1.0-SNAPSHOT.war
      - name: Upload WAR files
        uses: actions/upload-artifact@v4
        with:
          name: appointment-war-files
          path: services/*/target/*.war
          if-no-files-found: error
          retention-days: 7
